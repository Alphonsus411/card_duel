name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.7.22"

jobs:
  runtime:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release provenance tests compare archived evidence with the commit
          # that originally produced it, so CI needs that historical object.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --extra dev
      - name: Resolve package version
        id: package
        run: echo "version=$(uv run python -c 'from pathlib import Path; from scripts.project_metadata import read_project_version; print(read_project_version(Path.cwd()))')" >> "$GITHUB_OUTPUT"
      - run: uv run python scripts/verify_release.py --profile runtime --json docs/release-results/${{ steps.package.outputs.version }}/runtime-python-${{ matrix.python-version }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ matrix.python-version }}
          path: docs/release-results/${{ steps.package.outputs.version }}/runtime-python-${{ matrix.python-version }}.json
          if-no-files-found: error

  full:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the same provenance boundary in both validation profiles.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --extra dev
      - name: Resolve package metadata
        id: package
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.project_metadata import read_project_version

          version = read_project_version(Path.cwd())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"wheel=card_duel_engine-{version}-py3-none-any.whl\n")
          PY
      - run: uv run python scripts/verify_release.py --profile full --json docs/release-results/${{ steps.package.outputs.version }}/full-python-3.13.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: card-duel-engine-${{ steps.package.outputs.version }}-release
          path: |
            dist/${{ steps.package.outputs.wheel }}
            dist/SHA256SUMS
            dist/wheel-audit.json
            docs/release-results/${{ steps.package.outputs.version }}/full-python-3.13.json
          if-no-files-found: error
