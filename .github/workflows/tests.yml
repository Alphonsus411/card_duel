name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.7.22"

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --extra dev
      - run: git diff --exit-code -- uv.lock
      - run: uv run python -m mypy
      - run: uv run python -m compileall -q src tests scripts
      - run: uv run coverage run --branch -m unittest discover -s tests -v
      - run: uv run coverage report

  release-verification:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --extra dev
      - run: git diff --exit-code -- uv.lock
      - run: uv run python scripts/verify_release.py --json release-verification.json

  package:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --extra dev
      - run: git diff --exit-code -- uv.lock
      - run: uv run python scripts/verify_reproducible_wheel.py
      - name: Instalar wheel en Python 3.11–3.13
        run: |
          for version in 3.11 3.12 3.13; do
            uv python install "$version"
            uv venv --python "$version" ".wheel-venv-$version"
            uv pip install --python ".wheel-venv-$version/bin/python" --no-deps dist/*.whl
            ".wheel-venv-$version/bin/python" -c 'import card_duel_engine; assert card_duel_engine.__version__ == "0.15.0"'
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: card-duel-engine-0.15.0-wheel
          path: |
            dist/card_duel_engine-0.15.0-py3-none-any.whl
            dist/SHA256SUMS
            dist/wheel-audit.json
          if-no-files-found: error
