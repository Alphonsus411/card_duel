[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "card-duel-engine"
version = "0.14.0"
description = "Motor headless y extensible para el nuevo juego basado en las reglas universales de Fantasy Tokens."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Adolfo González Hernández"}]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src/card_duel_engine"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
